name: Sync Google Scholar

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scholar.yml'
      - 'scripts/sync_scholar.py'

permissions:
  contents: write

concurrency:
  group: scholar-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'protego>=0.3,<1'
      - run: python scripts/sync_scholar.py
      - name: Publish the verified snapshot
        run: |
          git add -- data/scholar.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Google Scholar publications and citations'
          git push origin HEAD:main
